name: Nightly Portfolio GitHub Sync

on:
  schedule:
    # Runs every day at 03:00 UTC (06:00 EEST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GitHub Activity Sync & Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_github.py
          python3 scripts/build_prod.py

      - name: Commit and Push Updated Data & Bundles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain data/ styles.min.css script.min.js)" ]; then
            git add data/ styles.min.css script.min.js
            git commit -m "chore(sync): automated nightly github activity & bundle update [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
